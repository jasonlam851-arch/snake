<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MODERN ARCADE SNAKE</title>
    <!-- 引入現代科技街機字型 Orbitron 與繁體中文無襯線字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #090c10;
            background-image: radial-gradient(circle at 50% 50%, #151d2a 0%, #090c10 100%);
            color: #00f0ff;
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        /* ---------------- 主選單 & 設定面板樣式 ---------------- */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 22, 36, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 240, 255, 0.15);
            border-radius: 12px;
            padding: 40px 30px;
            width: 340px;
            text-align: center;
            z-index: 2;
        }

        .game-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            margin-bottom: 30px;
            line-height: 1.3;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .game-title span {
            color: #ff0055;
            text-shadow: 0 0 10px rgba(ff, 0, 85, 0.5);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .menu-btn {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 14px 16px;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            outline: none;
            letter-spacing: 1px;
        }

        .btn-start {
            background: linear-gradient(135deg, #00f0ff 0%, #0088ff 100%);
            color: #000000;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.5);
        }

        .btn-settings {
            background: rgba(255, 255, 255, 0.05);
            color: #00f0ff;
            border-color: rgba(0, 240, 255, 0.4);
        }

        .btn-settings:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: #00f0ff;
        }

        .btn-disabled {
            background: rgba(255, 255, 255, 0.02);
            color: #4a5568;
            border-color: rgba(255, 255, 255, 0.08);
            cursor: not-allowed;
        }

        .lock-badge {
            font-size: 0.65rem;
            position: absolute;
            right: 12px;
            background: rgba(255, 0, 85, 0.15);
            color: #ff0055;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 0, 85, 0.3);
        }

        /* ---------------- 設定選單獨立面板 ---------------- */
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
            font-size: 0.8rem;
            color: #e2e8f0;
        }

        .toggle-btn {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 8px 16px;
            border: 1px solid #00f0ff;
            border-radius: 4px;
            cursor: pointer;
            background: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            transition: all 0.2s ease;
        }

        .toggle-btn.off {
            border-color: #4a5568;
            background: rgba(255, 255, 255, 0.05);
            color: #a0aec0;
        }

        .toast {
            position: fixed;
            top: 20px;
            background: #ff0055;
            color: #ffffff;
            padding: 10px 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            z-index: 20;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------------- 遊戲畫面樣式 ---------------- */
        .game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        .score-board {
            display: flex;
            gap: 25px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .score-board span {
            color: #00f0ff;
        }

        .game-container {
            position: relative;
            border: 2px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
            background-color: #0b0e14;
        }

        canvas {
            display: block;
            background-color: #0b0e14;
        }

        .game-over-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(9, 12, 16, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .game-over-text {
            color: #ff0055;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        .restart-btn {
            background: linear-gradient(135deg, #00f0ff 0%, #0088ff 100%);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 240, 255, 0.3);
        }

        /* ---------------- 手機操控區 ---------------- */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 190px;
            height: 190px;
            margin-top: 15px;
        }

        .btn-pad {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #00f0ff;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn-pad.active {
            background: #00f0ff;
            color: #000000;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
            transform: scale(0.95);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .btn-back {
            margin-top: 12px;
            background: transparent;
            color: #a0aec0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            color: #ffffff;
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <!-- 提示彈窗 -->
    <div id="toast" class="toast">提示：功能暫未開放</div>

    <!-- 1. 主選單介面 -->
    <div id="mainMenu" class="menu-container">
        <h1 class="game-title">MODERN<br><span>SNAKE</span></h1>
        <div class="button-group">
            <button class="menu-btn btn-start" onclick="enterGame()">開始遊戲</button>
            <button class="menu-btn btn-disabled" onclick="showLockedNotice('遊戲商城')">
                遊戲商城 <span class="lock-badge">鎖定</span>
            </button>
            <button class="menu-btn btn-settings" onclick="openSettings()">
                遊戲設定
            </button>
        </div>
    </div>

    <!-- 2. 設定選單介面 -->
    <div id="settingsMenu" class="menu-container" style="display: none;">
        <h1 class="game-title">SETTINGS</h1>
        
        <div class="settings-row">
            <span>畫布網格線</span>
            <button id="gridToggleBtn" class="toggle-btn" onclick="toggleGrid()">開啟 [ON]</button>
        </div>

        <button class="btn-back" onclick="closeSettings()" style="margin-top: 15px;">&lt; 返回主選單</button>
    </div>

    <!-- 3. 遊戲進行介面 -->
    <div id="gameScreen" class="game-screen">
        <header>
            <div class="score-board">
                <div>SCORE: <span id="score">0000</span></div>
                <div>HIGH: <span id="high-score">0000</span></div>
            </div>
        </header>

        <div class="game-container">
            <canvas id="gameCanvas" width="315" height="315"></canvas>
            <div id="gameOver" class="game-over-overlay" style="display: none;">
                <div class="game-over-text">GAME OVER</div>
                <button class="restart-btn" onclick="startGame()">再次挑戰</button>
            </div>
        </div>

        <!-- 方向觸控區 -->
        <div class="controls">
            <div class="btn-pad btn-up" 
                 onpointerdown="pressBtn(event, 'UP')" 
                 onpointerup="releaseBtn(event)" 
                 onpointerleave="releaseBtn(event)">▲</div>
            <div class="btn-pad btn-left" 
                 onpointerdown="pressBtn(event, 'LEFT')" 
                 onpointerup="releaseBtn(event)" 
                 onpointerleave="releaseBtn(event)">◄</div>
            <div class="btn-pad btn-right" 
                 onpointerdown="pressBtn(event, 'RIGHT')" 
                 onpointerup="releaseBtn(event)" 
                 onpointerleave="releaseBtn(event)">►</div>
            <div class="btn-pad btn-down" 
                 onpointerdown="pressBtn(event, 'DOWN')" 
                 onpointerup="releaseBtn(event)" 
                 onpointerleave="releaseBtn(event)">▼</div>
        </div>

        <button class="btn-back" onclick="backToMenu()">&lt; 返回主選單</button>
    </div>

    <script>
        const mainMenu = document.getElementById('mainMenu');
        const settingsMenu = document.getElementById('settingsMenu');
        const gameScreen = document.getElementById('gameScreen');
        const toast = document.getElementById('toast');
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const gameOverScreen = document.getElementById("gameOver");
        const gridToggleBtn = document.getElementById("gridToggleBtn");

        // 21x21 對稱網格 (315px / 15px)
        const gridSize = 15;
        const tileCount = canvas.width / gridSize;
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snake_high_score") || 0;
        let gameLoop = null;
        let gameRunning = false;
        let toastTimer = null;

        // 網格開關變數 (從 localStorage 讀取偏好，預設為 true 開啟)
        let showGrid = localStorage.getItem("snake_show_grid") !== "false";

        let inputQueue = [];

        highScoreElement.innerText = String(highScore).padStart(4, '0');
        updateGridBtnUI();

        /* ---------------- 選單切換與設定邏輯 ---------------- */
        function enterGame() {
            mainMenu.style.display = 'none';
            settingsMenu.style.display = 'none';
            gameScreen.style.display = 'flex';
            startGame();
        }

        function openSettings() {
            mainMenu.style.display = 'none';
            settingsMenu.style.display = 'flex';
        }

        function closeSettings() {
            settingsMenu.style.display = 'none';
            mainMenu.style.display = 'flex';
        }

        function toggleGrid() {
            showGrid = !showGrid;
            localStorage.setItem("snake_show_grid", showGrid);
            updateGridBtnUI();
        }

        function updateGridBtnUI() {
            if (showGrid) {
                gridToggleBtn.innerText = "開啟 [ON]";
                gridToggleBtn.classList.remove("off");
            } else {
                gridToggleBtn.innerText = "關閉 [OFF]";
                gridToggleBtn.classList.add("off");
            }
        }

        function backToMenu() {
            gameRunning = false;
            if (gameLoop) clearInterval(gameLoop);
            gameScreen.style.display = 'none';
            mainMenu.style.display = 'flex';
        }

        function showLockedNotice(featureName) {
            toast.innerText = `通知：${featureName} 暫未開放`;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        /* ---------------- 觸控與指令隊列 ---------------- */
        function pressBtn(e, dir) {
            if (e) e.preventDefault();
            e.currentTarget.classList.add('active');
            queueDirection(dir);
        }

        function releaseBtn(e) {
            if (e) e.preventDefault();
            e.currentTarget.classList.remove('active');
        }

        function getCurrDir() {
            if (dx === gridSize) return 'RIGHT';
            if (dx === -gridSize) return 'LEFT';
            if (dy === -gridSize) return 'UP';
            if (dy === gridSize) return 'DOWN';
            return 'RIGHT';
        }

        function isOpposite(dir1, dir2) {
            return (dir1 === 'UP' && dir2 === 'DOWN') ||
                   (dir1 === 'DOWN' && dir2 === 'UP') ||
                   (dir1 === 'LEFT' && dir2 === 'RIGHT') ||
                   (dir1 === 'RIGHT' && dir2 === 'LEFT');
        }

        function queueDirection(dir) {
            if (!gameRunning) return;
            const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : getCurrDir();

            if (lastDir === dir || isOpposite(lastDir, dir)) return;

            if (inputQueue.length < 2) {
                inputQueue.push(dir);
            }
        }

        function processInput() {
            if (inputQueue.length === 0) return;
            const nextDir = inputQueue.shift();

            if (nextDir === 'UP') { dx = 0; dy = -gridSize; }
            if (nextDir === 'DOWN') { dx = 0; dy = gridSize; }
            if (nextDir === 'LEFT') { dx = -gridSize; dy = 0; }
            if (nextDir === 'RIGHT') { dx = gridSize; dy = 0; }
        }

        /* ---------------- 貪食蛇遊戲核心邏輯 ---------------- */
        function startGame() {
            const centerTile = Math.floor(tileCount / 2); // 10
            snake = [
                { x: centerTile * gridSize, y: centerTile * gridSize },
                { x: (centerTile - 1) * gridSize, y: centerTile * gridSize },
                { x: (centerTile - 2) * gridSize, y: centerTile * gridSize }
            ];
            score = 0;
            dx = gridSize;
            dy = 0;
            inputQueue = [];
            scoreElement.innerText = "0000";
            gameOverScreen.style.display = "none";
            generateFood();
            gameRunning = true;
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(drawGame, 100);
        }

        function generateFood() {
            let newFoodPosition;
            do {
                newFoodPosition = {
                    x: Math.floor(Math.random() * tileCount) * gridSize,
                    y: Math.floor(Math.random() * tileCount) * gridSize
                };
            } while (snake.some(part => part.x === newFoodPosition.x && part.y === newFoodPosition.y));
            
            food = newFoodPosition;
        }

        function drawGridLines() {
            ctx.strokeStyle = "rgba(0, 240, 255, 0.08)";
            ctx.lineWidth = 1;

            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function drawGame() {
            if (!gameRunning) return;

            processInput();

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 撞牆判定
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return endGame();
            }

            // 撞自己判定
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return endGame();
                }
            }

            snake.unshift(head);

            // 吃食物判定
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = String(score).padStart(4, '0');
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.innerText = String(highScore).padStart(4, '0');
                    localStorage.setItem("snake_high_score", highScore);
                }
                generateFood();
            } else {
                snake.pop();
            }

            // 1. 清空背景
            ctx.fillStyle = "#0b0e14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 繪製精細畫布網格
            if (showGrid) {
                drawGridLines();
            }

            // 3. 繪製食物 (俐落霓虹粉)
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(food.x + 1, food.y + 1, gridSize - 2, gridSize - 2);

            // 4. 繪製蛇身 (蛇頭為亮白，蛇身為電光藍)
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.fillStyle = "#ffffff";
                } else {
                    ctx.fillStyle = "#00f0ff";
                }
                ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
            });
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            gameOverScreen.style.display = "flex";
        }

        window.addEventListener("keydown", e => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                e.preventDefault();
            }
            if (e.key === "ArrowUp") queueDirection('UP');
            if (e.key === "ArrowDown") queueDirection('DOWN');
            if (e.key === "ArrowLeft") queueDirection('LEFT');
            if (e.key === "ArrowRight") queueDirection('RIGHT');
        });
    </script>
</body>
</html>
