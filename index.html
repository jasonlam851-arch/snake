<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PURPLE ARCADE SNAKE</title>

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #12072b 0%, #06020e 100%);
            color: #d8b4fe;
            font-family: 'Chakra Petch', 'Noto Sans TC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        /* ---------------- 主選單 & 容器面板 ---------------- */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(24, 11, 43, 0.9);
            border: 2px solid #8b5cf6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3), inset 0 0 15px rgba(236, 72, 153, 0.15);
            border-radius: 12px;
            padding: 30px 25px;
            width: 340px;
            text-align: center;
            z-index: 2;
            position: relative;
        }

        /* 金幣顯示列 */
        .coin-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.15);
        }

        .game-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 25px;
            line-height: 1.2;
            background: linear-gradient(to right, #c084fc, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(192, 132, 252, 0.3);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .menu-btn {
            font-family: 'Chakra Petch', 'Noto Sans TC', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 12px 16px;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            outline: none;
            letter-spacing: 1px;
        }

        .btn-start {
            background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
            border-color: #f472b6;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(219, 39, 119, 0.6);
        }

        .btn-shop {
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
            border-color: #f59e0b;
        }

        .btn-shop:hover {
            background: rgba(251, 191, 36, 0.25);
            border-color: #fbbf24;
        }

        .btn-settings {
            background: rgba(139, 92, 246, 0.15);
            color: #e9d5ff;
            border-color: #8b5cf6;
        }

        .btn-settings:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: #c084fc;
        }

        /* ---------------- 商城列表樣式 ---------------- */
        .shop-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-bottom: 15px;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 10px 14px;
            border-radius: 8px;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .item-name {
            font-size: 0.8rem;
            font-weight: 700;
            color: #f3e8ff;
        }

        .item-price {
            font-size: 0.7rem;
            color: #fbbf24;
        }

        .buy-btn {
            font-family: 'Chakra Petch', 'Noto Sans TC', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .buy-btn.equip {
            background: rgba(139, 92, 246, 0.2);
            color: #c084fc;
            border-color: #8b5cf6;
        }

        .buy-btn.equipped {
            background: #10b981;
            color: #000;
            border-color: #34d399;
            cursor: default;
        }

        .buy-btn.buy {
            background: #fbbf24;
            color: #000;
            border-color: #f59e0b;
        }

        /* ---------------- 設定選單獨立面板 ---------------- */
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #f3e8ff;
        }

        .toggle-btn {
            font-family: 'Chakra Petch', 'Noto Sans TC', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 12px;
            border: 1px solid #c084fc;
            border-radius: 4px;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.4) 0%, rgba(219, 39, 119, 0.4) 100%);
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .toggle-btn.off {
            border-color: #4b5563;
            background: rgba(255, 255, 255, 0.05);
            color: #9ca3af;
        }

        .toast {
            position: fixed;
            top: 20px;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: #ffffff;
            padding: 10px 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.5);
            z-index: 20;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------------- 遊戲畫面樣式 ---------------- */
        .game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        .score-board {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .score-board span {
            color: #f472b6;
        }

        .game-container {
            position: relative;
            border: 2px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
            border-radius: 8px;
            overflow: hidden;
            background-color: #0d0618;
        }

        canvas {
            display: block;
            background-color: #0d0618;
        }

        .game-over-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(13, 6, 24, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .game-over-text {
            background: linear-gradient(to right, #f43f5e, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
            color: #ffffff;
            border: 1px solid #f472b6;
            padding: 10px 20px;
            font-family: 'Chakra Petch', 'Noto Sans TC', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.4);
        }

        /* ---------------- 大尺寸手機操控區 ---------------- */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            width: 260px; /* 從 190px 大幅加大至 260px */
            height: 260px;
            margin-top: 15px;
            touch-action: none;
        }

        .btn-pad {
            background: rgba(139, 92, 246, 0.18);
            border: 2px solid rgba(168, 85, 247, 0.4);
            border-radius: 14px;
            color: #f3e8ff;
            font-size: 1.8rem; /* 加大箭頭尺寸 */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-pad.active {
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: #ffffff;
            border-color: #f472b6;
            box-shadow: 0 0 15px rgba(219, 39, 119, 0.8);
            transform: scale(0.92);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .btn-back {
            margin-top: 15px;
            background: transparent;
            color: #c084fc;
            border: 1px solid rgba(192, 132, 252, 0.3);
            padding: 8px 18px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            color: #ffffff;
            border-color: #c084fc;
            background: rgba(139, 92, 246, 0.2);
        }
    </style>
</head>
<body>

    <!-- 提示彈窗 -->
    <div id="toast" class="toast">提示訊息</div>

    <!-- 1. 主選單介面 -->
    <div id="mainMenu" class="menu-container">
        <!-- 主頁面頂部金幣顯示 -->
        <div class="coin-bar">
            COINS: <span id="mainCoinDisplay">0</span>
        </div>

        <h1 class="game-title">PURPLE<br>ARCADE</h1>
        <div class="button-group">
            <button class="menu-btn btn-start" onclick="enterGame()">開始遊戲</button>
            <button class="menu-btn btn-shop" onclick="openShop()">遊戲商城</button>
            <button class="menu-btn btn-settings" onclick="openSettings()">遊戲設定</button>
        </div>
    </div>

    <!-- 2. 商城介面 -->
    <div id="shopMenu" class="menu-container" style="display: none;">
        <div class="coin-bar">
            COINS: <span id="shopCoinDisplay">0</span>
        </div>

        <h1 class="game-title" style="margin-bottom: 15px;">STORE</h1>
        
        <div class="shop-list" id="shopListContainer">
            <!-- 商城項目由 JS 動態生成 -->
        </div>

        <button class="btn-back" onclick="closeShop()">&lt; 返回主選單</button>
    </div>

    <!-- 3. 設定選單介面 -->
    <div id="settingsMenu" class="menu-container" style="display: none;">
        <h1 class="game-title">SETTINGS</h1>
        
        <div class="settings-row">
            <span>畫布網格線</span>
            <button id="gridToggleBtn" class="toggle-btn" onclick="toggleGrid()">開啟 [ON]</button>
        </div>

        <button class="btn-back" onclick="closeSettings()">&lt; 返回主選單</button>
    </div>

    <!-- 4. 遊戲進行介面 -->
    <div id="gameScreen" class="game-screen">
        <header>
            <div class="score-board">
                <div>SCORE: <span id="score">0000</span></div>
                <div>HIGH: <span id="high-score">0000</span></div>
                <div style="color: #fbbf24;">COINS: <span id="gameCoinDisplay" style="color: #fbbf24;">0</span></div>
            </div>
        </header>

        <div class="game-container">
            <canvas id="gameCanvas" width="315" height="315"></canvas>
            <div id="gameOver" class="game-over-overlay" style="display: none;">
                <div class="game-over-text">GAME OVER</div>
                <button class="restart-btn" onclick="startGame()">再次挑戰</button>
            </div>
        </div>

        <!-- 放大版手機觸控區 -->
        <div class="controls">
            <div class="btn-pad btn-up" 
                 onpointerdown="pressBtn(event, 'UP')" 
                 onpointerup="releaseBtn(event)" 
                 onpointerleave="releaseBtn(event)">▲</div>
            <div class="btn-pad btn-left" 
                 onpointerdown="pressBtn(event, 'LEFT')" 
                 onpointerup="releaseBtn(event)" 
                 onpointerleave="releaseBtn(event)">◄</div>
            <div class="btn-pad btn-right" 
                 onpointerdown="pressBtn(event, 'RIGHT')" 
                 onpointerup="releaseBtn(event)" 
                 onpointerleave="releaseBtn(event)">►</div>
            <div class="btn-pad btn-down" 
                 onpointerdown="pressBtn(event, 'DOWN')" 
                 onpointerup="releaseBtn(event)" 
                 onpointerleave="releaseBtn(event)">▼</div>
        </div>

        <button class="btn-back" onclick="backToMenu()">&lt; 返回主選單</button>
    </div>

    <script>
        const mainMenu = document.getElementById('mainMenu');
        const shopMenu = document.getElementById('shopMenu');
        const settingsMenu = document.getElementById('settingsMenu');
        const gameScreen = document.getElementById('gameScreen');
        const toast = document.getElementById('toast');
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const gameOverScreen = document.getElementById("gameOver");
        const gridToggleBtn = document.getElementById("gridToggleBtn");

        // 金幣顯示元素
        const mainCoinDisplay = document.getElementById("mainCoinDisplay");
        const shopCoinDisplay = document.getElementById("shopCoinDisplay");
        const gameCoinDisplay = document.getElementById("gameCoinDisplay");

        // 21x21 對稱網格 (315px / 15px)
        const gridSize = 15;
        const tileCount = canvas.width / gridSize;
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snake_high_score") || 0;
        let coins = parseInt(localStorage.getItem("snake_coins") || "0");
        let gameLoop = null;
        let gameRunning = false;
        let toastTimer = null;

        // 網格開關變數
        let showGrid = localStorage.getItem("snake_show_grid") !== "false";

        // 皮膚商城資料
        const skins = [
            { id: 'white', name: '原始白蛇 (頭白漸變淡)', price: 0 },
            { id: 'red', name: '紅色漸變蛇', price: 100 },
            { id: 'purple', name: '紫色漸變蛇', price: 500 }
        ];
        
        let ownedSkins = JSON.parse(localStorage.getItem("snake_owned_skins") || '["white"]');
        let currentSkin = localStorage.getItem("snake_current_skin") || "white";

        let inputQueue = [];

        highScoreElement.innerText = String(highScore).padStart(4, '0');
        updateCoinDisplay();
        updateGridBtnUI();

        /* ---------------- 金幣與商城邏輯 ---------------- */
        function updateCoinDisplay() {
            mainCoinDisplay.innerText = coins;
            shopCoinDisplay.innerText = coins;
            gameCoinDisplay.innerText = coins;
            localStorage.setItem("snake_coins", coins);
        }

        function openShop() {
            mainMenu.style.display = 'none';
            renderShopList();
            shopMenu.style.display = 'flex';
        }

        function closeShop() {
            shopMenu.style.display = 'none';
            mainMenu.style.display = 'flex';
        }

        function renderShopList() {
            const container = document.getElementById("shopListContainer");
            container.innerHTML = "";

            skins.forEach(skin => {
                const isOwned = ownedSkins.includes(skin.id);
                const isEquipped = currentSkin === skin.id;

                const itemDiv = document.createElement("div");
                itemDiv.className = "shop-item";

                let btnHTML = "";
                if (isEquipped) {
                    btnHTML = `<button class="buy-btn equipped">使用中</button>`;
                } else if (isOwned) {
                    btnHTML = `<button class="buy-btn equip" onclick="equipSkin('${skin.id}')">裝備</button>`;
                } else {
                    btnHTML = `<button class="buy-btn buy" onclick="buySkin('${skin.id}', ${skin.price})">購買</button>`;
                }

                itemDiv.innerHTML = `
                    <div class="item-info">
                        <div class="item-name">${skin.name}</div>
                        <div class="item-price">${skin.price === 0 ? "免費預設" : skin.price + " 金幣"}</div>
                    </div>
                    ${btnHTML}
                `;
                container.appendChild(itemDiv);
            });
        }

        function buySkin(skinId, price) {
            if (coins >= price) {
                coins -= price;
                ownedSkins.push(skinId);
                currentSkin = skinId;
                
                localStorage.setItem("snake_owned_skins", JSON.stringify(ownedSkins));
                localStorage.setItem("snake_current_skin", currentSkin);
                
                updateCoinDisplay();
                renderShopList();
                showToast("解鎖成功並已裝備！");
            } else {
                showToast("金幣不足！請多玩遊戲賺取金幣");
            }
        }

        function equipSkin(skinId) {
            currentSkin = skinId;
            localStorage.setItem("snake_current_skin", currentSkin);
            renderShopList();
            showToast("已成功更換蛇身皮膚！");
        }

        /* ---------------- 選單切換與設定邏輯 ---------------- */
        function enterGame() {
            mainMenu.style.display = 'none';
            settingsMenu.style.display = 'none';
            shopMenu.style.display = 'none';
            gameScreen.style.display = 'flex';
            startGame();
        }

        function openSettings() {
            mainMenu.style.display = 'none';
            settingsMenu.style.display = 'flex';
        }

        function closeSettings() {
            settingsMenu.style.display = 'none';
            mainMenu.style.display = 'flex';
        }

        function toggleGrid() {
            showGrid = !showGrid;
            localStorage.setItem("snake_show_grid", showGrid);
            updateGridBtnUI();
        }

        function updateGridBtnUI() {
            if (showGrid) {
                gridToggleBtn.innerText = "開啟 [ON]";
                gridToggleBtn.classList.remove("off");
            } else {
                gridToggleBtn.innerText = "關閉 [OFF]";
                gridToggleBtn.classList.add("off");
            }
        }

        function backToMenu() {
            gameRunning = false;
            if (gameLoop) clearInterval(gameLoop);
            gameScreen.style.display = 'none';
            mainMenu.style.display = 'flex';
            updateCoinDisplay();
        }

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        /* ---------------- 觸控與指令隊列 ---------------- */
        function pressBtn(e, dir) {
            if (e) e.preventDefault();
            e.currentTarget.classList.add('active');
            queueDirection(dir);
        }

        function releaseBtn(e) {
            if (e) e.preventDefault();
            e.currentTarget.classList.remove('active');
        }

        function getCurrDir() {
            if (dx === gridSize) return 'RIGHT';
            if (dx === -gridSize) return 'LEFT';
            if (dy === -gridSize) return 'UP';
            if (dy === gridSize) return 'DOWN';
            return 'RIGHT';
        }

        function isOpposite(dir1, dir2) {
            return (dir1 === 'UP' && dir2 === 'DOWN') ||
                   (dir1 === 'DOWN' && dir2 === 'UP') ||
                   (dir1 === 'LEFT' && dir2 === 'RIGHT') ||
                   (dir1 === 'RIGHT' && dir2 === 'LEFT');
        }

        function queueDirection(dir) {
            if (!gameRunning) return;
            const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : getCurrDir();

            if (lastDir === dir || isOpposite(lastDir, dir)) return;

            if (inputQueue.length < 2) {
                inputQueue.push(dir);
            }
        }

        function processInput() {
            if (inputQueue.length === 0) return;
            const nextDir = inputQueue.shift();

            if (nextDir === 'UP') { dx = 0; dy = -gridSize; }
            if (nextDir === 'DOWN') { dx = 0; dy = gridSize; }
            if (nextDir === 'LEFT') { dx = -gridSize; dy = 0; }
            if (nextDir === 'RIGHT') { dx = gridSize; dy = 0; }
        }

        /* ---------------- 貪食蛇遊戲核心邏輯 ---------------- */
        function startGame() {
            const centerTile = Math.floor(tileCount / 2); // 10
            snake = [
                { x: centerTile * gridSize, y: centerTile * gridSize },
                { x: (centerTile - 1) * gridSize, y: centerTile * gridSize },
                { x: (centerTile - 2) * gridSize, y: centerTile * gridSize }
            ];
            score = 0;
            dx = gridSize;
            dy = 0;
            inputQueue = [];
            scoreElement.innerText = "0000";
            gameOverScreen.style.display = "none";
            generateFood();
            gameRunning = true;
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(drawGame, 100);
        }

        function generateFood() {
            let newFoodPosition;
            do {
                newFoodPosition = {
                    x: Math.floor(Math.random() * tileCount) * gridSize,
                    y: Math.floor(Math.random() * tileCount) * gridSize
                };
            } while (snake.some(part => part.x === newFoodPosition.x && part.y === newFoodPosition.y));
            
            food = newFoodPosition;
        }

        function drawGridLines() {
            ctx.strokeStyle = "rgba(168, 85, 247, 0.12)";
            ctx.lineWidth = 1;

            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function getSnakePartColor(index, totalLength) {
            const ratio = index / Math.max(1, totalLength - 1);

            if (currentSkin === 'red') {
                if (index === 0) return "#ffffff";
                const r = 244;
                const g = Math.floor(63 + (200 - 63) * ratio);
                const b = Math.floor(94 + (200 - 94) * ratio);
                return `rgb(${r}, ${g}, ${b})`;
            } else if (currentSkin === 'purple') {
                if (index === 0) return "#ffffff";
                const r = Math.floor(168 + (233 - 168) * ratio);
                const g = Math.floor(85 + (213 - 85) * ratio);
                const b = 247;
                return `rgb(${r}, ${g}, ${b})`;
            } else {
                const alpha = Math.max(0.3, 1 - ratio * 0.65);
                return `rgba(255, 255, 255, ${alpha})`;
            }
        }

        function drawGame() {
            if (!gameRunning) return;

            processInput();

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 撞牆判定
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return endGame();
            }

            // 撞自己判定
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return endGame();
                }
            }

            snake.unshift(head);

            // 吃食物判定
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                coins += 10;
                updateCoinDisplay();

                scoreElement.innerText = String(score).padStart(4, '0');
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.innerText = String(highScore).padStart(4, '0');
                    localStorage.setItem("snake_high_score", highScore);
                }
                generateFood();
            } else {
                snake.pop();
            }

            // 清空與繪製
            ctx.fillStyle = "#0d0618";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (showGrid) {
                drawGridLines();
            }

            ctx.fillStyle = "#fbbf24";
            ctx.fillRect(food.x + 1, food.y + 1, gridSize - 2, gridSize - 2);

            snake.forEach((part, index) => {
                ctx.fillStyle = getSnakePartColor(index, snake.length);
                ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
            });
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            gameOverScreen.style.display = "flex";
        }

        window.addEventListener("keydown", e => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                e.preventDefault();
            }
            if (e.key === "ArrowUp") queueDirection('UP');
            if (e.key === "ArrowDown") queueDirection('DOWN');
            if (e.key === "ArrowLeft") queueDirection('LEFT');
            if (e.key === "ArrowRight") queueDirection('RIGHT');
        });
    </script>
</body>
</html>
