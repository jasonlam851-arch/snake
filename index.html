<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCADE SNAKE 1988 - 主選單</title>
    <!-- 引入像素風格字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #050508;
            color: #00ffcc;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* CRT 螢幕掃描線特效 */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        /* 主選單容器 */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 15, 0.85);
            border: 4px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4), inset 0 0 15px rgba(0, 255, 204, 0.2);
            border-radius: 8px;
            padding: 40px 30px;
            width: 360px;
            text-align: center;
            z-index: 2;
            transition: all 0.3s ease;
        }

        /* 遊戲標題 */
        .game-title {
            font-size: 1.4rem;
            color: #ff007f;
            text-shadow: 3px 3px #00ffff, -3px -3px #ff007f;
            margin-bottom: 35px;
            line-height: 1.5;
            letter-spacing: 2px;
            animation: pulseTitle 2s infinite alternate;
        }

        /* 按鈕區域 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }

        /* 通用按鈕樣式 */
        .btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            padding: 16px 10px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            outline: none;
        }

        /* 可使用的按鈕：開始遊戲 */
        .btn-start {
            background-color: #00ffcc;
            color: #000;
            border-color: #00ffcc;
            box-shadow: 0 0 10px #00ffcc, 4px 4px 0px #ff007f;
            font-weight: bold;
        }

        .btn-start:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 20px #00ffcc, 6px 6px 0px #ff007f;
            background-color: #33ffd6;
        }

        .btn-start:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #ff007f;
        }

        /* 未開放按鈕：商城與設定 */
        .btn-disabled {
            background-color: #1a1a24;
            color: #555566;
            border-color: #333344;
            cursor: not-allowed;
            box-shadow: 2px 2px 0px #111;
            filter: grayscale(60%);
        }

        .btn-disabled:hover {
            border-color: #ff0055;
            color: #884455;
        }

        /* 按鈕右側鎖定標籤 */
        .lock-badge {
            font-size: 0.55rem;
            position: absolute;
            right: 10px;
            background: #2a1122;
            color: #ff4477;
            padding: 3px 6px;
            border-radius: 3px;
            border: 1px solid #ff0055;
        }

        /* 提示彈窗 (Toast) */
        .toast {
            position: fixed;
            top: 30px;
            background: #ff007f;
            color: #fff;
            padding: 12px 20px;
            font-size: 0.65rem;
            border-radius: 4px;
            box-shadow: 0 0 15px #ff007f;
            z-index: 20;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            pointer-events: none;
            line-height: 1.4;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 遊戲畫面容器（預設隱藏） */
        .game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .btn-back {
            margin-top: 15px;
            background: transparent;
            color: #ff007f;
            border: 2px solid #ff007f;
            padding: 10px;
            font-size: 0.65rem;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-back:hover {
            background: #ff007f;
            color: #fff;
        }

        /* 動畫效果 */
        @keyframes pulseTitle {
            0% { text-shadow: 3px 3px #00ffff, -3px -3px #ff007f; }
            100% { text-shadow: 5px 5px #00ffff, -5px -5px #ff007f, 0 0 12px #ff007f; }
        }
    </style>
</head>
<body>

    <!-- 頂部提示訊息彈窗 -->
    <div id="toast" class="toast">⚠️ 功能暫未開放，敬請期待！</div>

    <!-- 主選單介面 -->
    <div id="mainMenu" class="menu-container">
        <h1 class="game-title">ARCADE<br>SNAKE</h1>
        
        <div class="button-group">
            <!-- 唯一可用的按鈕 -->
            <button class="btn btn-start" onclick="startGame()">
                🎮 開始遊戲
            </button>

            <!-- 暫不開放的按鈕 1 -->
            <button class="btn btn-disabled" onclick="showLockedNotice('遊戲商城')">
                🛒 遊戲商城
                <span class="lock-badge">🔒 鎖定</span>
            </button>

            <!-- 暫不開放的按鈕 2 -->
            <button class="btn btn-disabled" onclick="showLockedNotice('遊戲設定')">
                ⚙️ 遊戲設定
                <span class="lock-badge">🔒 鎖定</span>
            </button>
        </div>
    </div>

    <!-- 遊戲進行畫面（點擊開始遊戲後顯示） -->
    <div id="gameScreen" class="game-screen">
        <div style="color: #00ffcc; margin-bottom: 10px; font-size: 0.8rem;">--- GAME RUNNING ---</div>
        <!-- 這裡可以放您的 Canvas 畫布 -->
        <canvas id="canvas" width="300" height="300" style="background: #000; border: 3px solid #00ffcc;"></canvas>
        <button class="btn-back" onclick="backToMenu()">◀ 返回主選單</button>
    </div>

    <script>
        const mainMenu = document.getElementById('mainMenu');
        const gameScreen = document.getElementById('gameScreen');
        const toast = document.getElementById('toast');
        let toastTimer = null;

        // 點擊「開始遊戲」
        function startGame() {
            mainMenu.style.display = 'none';
            gameScreen.style.display = 'flex';
            // 在這裡可呼叫您貪食蛇遊戲的初始化邏輯，如：startGameLoop();
        }

        // 點擊「返回主選單」
        function backToMenu() {
            gameScreen.style.display = 'none';
            mainMenu.style.display = 'flex';
        }

        // 點擊「未開放按鈕」時觸發提示
        function showLockedNotice(featureName) {
            toast.innerText = `🚨 [${featureName}] 暫未開放！`;
            toast.classList.add('show');

            // 防止重複點擊導致計時器衝突
            if (toastTimer) clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
