<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCADE SNAKE 80s</title>
    <!-- 引入懷舊街機像素字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        /* CRT 螢幕掃描線模擬效果 */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        /* 標題與計分板 */
        header {
            text-align: center;
            margin-top: 5px;
            z-index: 2;
        }

        h1 {
            font-size: 1.2rem;
            color: #ff007f;
            text-shadow: 2px 2px #00ffff, -2px -2px #ff007f;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .score-board {
            display: flex;
            gap: 20px;
            font-size: 0.7rem;
            color: #fff;
            text-shadow: 0 0 5px #00ffcc;
        }

        /* 遊戲畫布區域 */
        .game-container {
            position: relative;
            margin: 10px 0;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 15px #00ffcc, inset 0 0 15px #00ffcc;
            border-radius: 4px;
            background-color: #000;
            z-index: 2;
        }

        canvas {
            display: block;
            background-color: #080808;
        }

        /* 遊戲結束覆蓋畫面 */
        .game-over-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .game-over-text {
            color: #ff0055;
            font-size: 1rem;
            text-shadow: 0 0 8px #ff0055;
            margin-bottom: 15px;
            animation: blink 1s infinite;
        }

        .restart-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            font-weight: bold;
            box-shadow: 3px 3px 0px #ff007f;
            cursor: pointer;
        }

        .restart-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #ff007f;
        }

        /* 街機控制器 (虛擬按鈕) */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 200px;
            height: 200px;
            margin-bottom: 10px;
            z-index: 2;
        }

        .btn {
            background: #111;
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #222, inset 0 0 8px rgba(255, 255, 255, 0.1);
        }

        .btn:active {
            background: #222;
            box-shadow: 0 1px 0 #222;
            transform: translateY(3px);
            color: #00ffcc;
            border-color: #00ffcc;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <header>
        <h1>SNAKE 1988</h1>
        <div class="score-board">
            <div>SCORE: <span id="score">0000</span></div>
            <div>HIGH: <span id="high-score">0000</span></div>
        </div>
    </header>

    <div class="game-container">
        <canvas id="gameCanvas" width="300" height="300"></canvas>
        <div id="gameOver" class="game-over-overlay" style="display: none;">
            <div class="game-over-text">GAME OVER</div>
            <button class="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <!-- 街機 D-Pad 操作區 -->
    <div class="controls">
        <div class="btn btn-up" onclick="changeDirection('UP')">▲</div>
        <div class="btn btn-left" onclick="changeDirection('LEFT')">◄</div>
        <div class="btn btn-right" onclick="changeDirection('RIGHT')">►</div>
        <div class="btn btn-down" onclick="changeDirection('DOWN')">▼</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const gameOverScreen = document.getElementById("gameOver");

        // 網格設定
        const gridSize = 15;
        const tileCount = canvas.width / gridSize;

        // 遊戲狀態
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snake_high_score") || 0;
        let gameLoop;
        let gameRunning = false;

        highScoreElement.innerText = String(highScore).padStart(4, '0');

        function startGame() {
            snake = [
                { x: 10 * gridSize, y: 10 * gridSize },
                { x: 9 * gridSize, y: 10 * gridSize },
                { x: 8 * gridSize, y: 10 * gridSize }
            ];
            score = 0;
            dx = gridSize;
            dy = 0;
            scoreElement.innerText = "0000";
            gameOverScreen.style.display = "none";
            generateFood();
            gameRunning = true;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(drawGame, 100);
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;
            // 確保食物不會刷在蛇身上
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function drawGame() {
            if (!gameRunning) return;

            // 移動蛇頭
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 撞牆判定
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return endGame();
            }

            // 撞自己判定
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return endGame();
                }
            }

            snake.unshift(head);

            // 吃食物判定
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = String(score).padStart(4, '0');
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.innerText = String(highScore).padStart(4, '0');
                    localStorage.setItem("snake_high_score", highScore);
                }
                generateFood();
            } else {
                snake.pop();
            }

            // 繪製背景
            ctx.fillStyle = "#080808";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製食物 (霓虹粉紅色)
            ctx.fillStyle = "#ff007f";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#ff007f";
            ctx.fillRect(food.x + 1, food.y + 1, gridSize - 2, gridSize - 2);

            // 繪製蛇身 (霓虹綠色)
            ctx.fillStyle = "#00ffcc";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#00ffcc";
            snake.forEach((part, index) => {
                // 蛇頭顏色稍微不同
                if (index === 0) ctx.fillStyle = "#ffffff";
                else ctx.fillStyle = "#00ffcc";
                ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
            });

            // 清除發光特效發散
            ctx.shadowBlur = 0;
        }

        function changeDirection(dir) {
            if (!gameRunning) return;
            if (dir === 'UP' && dy === 0) { dx = 0; dy = -gridSize; }
            if (dir === 'DOWN' && dy === 0) { dx = 0; dy = gridSize; }
            if (dir === 'LEFT' && dx === 0) { dx = -gridSize; dy = 0; }
            if (dir === 'RIGHT' && dx === 0) { dx = gridSize; dy = 0; }
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            gameOverScreen.style.display = "flex";
        }

        function resetGame() {
            startGame();
        }

        // 鍵盤方向鍵支援 (供電腦測試用)
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowUp") changeDirection('UP');
            if (e.key === "ArrowDown") changeDirection('DOWN');
            if (e.key === "ArrowLeft") changeDirection('LEFT');
            if (e.key === "ArrowRight") changeDirection('RIGHT');
        });

        // 初始化遊戲
        startGame();
    </script>
</body>
</html>
